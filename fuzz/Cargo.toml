[package]
name = "isl-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "libFuzzer targets for IronSocketLayer's peer-facing parsers. Not part of the library."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ironsocketlayer = { path = "../crates/ironsocketlayer" }
ic-drbg = { path = "../../IronCrypto/crates/ic-drbg" }
ic-core = { path = "../../IronCrypto/crates/ic-core" }

[lib]
path = "src/lib.rs"

# Writes seed inputs recorded from real handshakes into corpus/.
[[bin]]
name = "seed-corpus"
path = "src/seed.rs"
test = false
doc = false

[[bin]]
name = "messages"
path = "fuzz_targets/messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "records"
path = "fuzz_targets/records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pki"
path = "fuzz_targets/pki.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls_server"
path = "fuzz_targets/tls_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls_client"
path = "fuzz_targets/tls_client.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fixed_server"
path = "fuzz_targets/fixed_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fixed_client"
path = "fuzz_targets/fixed_client.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quic_server"
path = "fuzz_targets/quic_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pki_differential"
path = "fuzz_targets/pki_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hello_differential"
path = "fuzz_targets/hello_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_hello_differential"
path = "fuzz_targets/server_hello_differential.rs"
test = false
doc = false
bench = false

# One IronCrypto: IronPKI names it by version, and here it is the checkout
# beside this repository. See the workspace Cargo.toml.
[patch.crates-io]
ic-core = { path = "../../IronCrypto/crates/ic-core" }
ic-hash = { path = "../../IronCrypto/crates/ic-hash" }
ic-mac = { path = "../../IronCrypto/crates/ic-mac" }
ic-kdf = { path = "../../IronCrypto/crates/ic-kdf" }
ic-cipher = { path = "../../IronCrypto/crates/ic-cipher" }
ic-drbg = { path = "../../IronCrypto/crates/ic-drbg" }
ic-ec = { path = "../../IronCrypto/crates/ic-ec" }
ic-rsa = { path = "../../IronCrypto/crates/ic-rsa" }
ic-pkix = { path = "../../IronCrypto/crates/ic-pkix" }
ic-hpke = { path = "../../IronCrypto/crates/ic-hpke" }
ic-mlkem = { path = "../../IronCrypto/crates/ic-mlkem" }
ic-mldsa = { path = "../../IronCrypto/crates/ic-mldsa" }
ic-fips = { path = "../../IronCrypto/crates/ic-fips" }
ic-ontology = { path = "../../IronCrypto/crates/ic-ontology" }
ic-sig = { path = "../../IronCrypto/crates/ic-sig" }
ic-lms = { path = "../../IronCrypto/crates/ic-lms" }
ic-slhdsa = { path = "../../IronCrypto/crates/ic-slhdsa" }
