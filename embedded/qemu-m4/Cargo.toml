[package]
name = "isl-qemu-m4"
version = "0.0.0"
edition = "2021"
publish = false
description = "Runs the fixed-capacity engine on an emulated Cortex-M4 (QEMU MPS2-AN386) and measures it. Not part of the library."

[dependencies]
ironsocketlayer = { path = "../../crates/ironsocketlayer", default-features = false }
ic-core = { path = "../../../IronCrypto/crates/ic-core", default-features = false }
ic-drbg = { path = "../../../IronCrypto/crates/ic-drbg", default-features = false }
# Board support, only here: this crate is excluded from the library's
# workspace, so none of these reach the library's dependency graph.
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
embedded-alloc = "0.6"

# Its own workspace root, as for bench/ and fuzz/.
[workspace]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
panic = "abort"

# One IronCrypto: IronPKI names it by version, and here it is the checkout
# beside this repository. See the workspace Cargo.toml.
[patch.crates-io]
ic-core = { path = "../../../IronCrypto/crates/ic-core" }
ic-hash = { path = "../../../IronCrypto/crates/ic-hash" }
ic-mac = { path = "../../../IronCrypto/crates/ic-mac" }
ic-kdf = { path = "../../../IronCrypto/crates/ic-kdf" }
ic-cipher = { path = "../../../IronCrypto/crates/ic-cipher" }
ic-drbg = { path = "../../../IronCrypto/crates/ic-drbg" }
ic-ec = { path = "../../../IronCrypto/crates/ic-ec" }
ic-rsa = { path = "../../../IronCrypto/crates/ic-rsa" }
ic-pkix = { path = "../../../IronCrypto/crates/ic-pkix" }
ic-hpke = { path = "../../../IronCrypto/crates/ic-hpke" }
ic-mlkem = { path = "../../../IronCrypto/crates/ic-mlkem" }
ic-mldsa = { path = "../../../IronCrypto/crates/ic-mldsa" }
ic-fips = { path = "../../../IronCrypto/crates/ic-fips" }
ic-ontology = { path = "../../../IronCrypto/crates/ic-ontology" }
ic-sig = { path = "../../../IronCrypto/crates/ic-sig" }
ic-lms = { path = "../../../IronCrypto/crates/ic-lms" }
ic-slhdsa = { path = "../../../IronCrypto/crates/ic-slhdsa" }
