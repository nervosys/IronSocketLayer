name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: IronSocketLayer
      # IronCrypto is a path dependency at ../IronCrypto.
      - uses: actions/checkout@v4
        with:
          repository: nervosys/IronCrypto
          path: IronCrypto
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabihf
      - name: test
        working-directory: IronSocketLayer
        run: cargo test --workspace
      - name: clippy
        working-directory: IronSocketLayer
        run: cargo clippy --workspace --all-targets
      - name: no_std (Cortex-M)
        working-directory: IronSocketLayer
        run: cargo build -p iron-socket-layer --no-default-features --target thumbv7em-none-eabihf
      - name: benchmark harness compiles
        working-directory: IronSocketLayer
        run: cargo check --manifest-path bench/Cargo.toml
      - name: interoperability with public servers
        if: matrix.os == 'ubuntu-latest'
        working-directory: IronSocketLayer
        run: cargo test -p iron-socket-layer --test interop -- --ignored

  fuzz:
    # A short run of every target: enough to catch a parser change that
    # crashes on the seed corpus or close to it. Long campaigns run elsewhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: IronSocketLayer
      - uses: actions/checkout@v4
        with:
          repository: nervosys/IronCrypto
          path: IronCrypto
      - uses: dtolnay/rust-toolchain@nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: seed corpus
        working-directory: IronSocketLayer/fuzz
        run: cargo run --bin seed-corpus
      - name: fuzz each target for 60 seconds
        working-directory: IronSocketLayer
        run: |
          for t in messages records pki tls_server tls_client quic_server; do
            cargo +nightly fuzz run --fuzz-dir fuzz -O "$t" -- -max_total_time=60 -timeout=10
          done
