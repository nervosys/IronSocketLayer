[package]
name = "isl-bench"
version = "0.0.0"
edition = "2021"
publish = false
description = "Handshake and throughput comparison against rustls. Not part of the library."

[dependencies]
iron-socket-layer = { path = "../crates/iron-socket-layer" }
# The comparison. Only here: `bench` is excluded from the workspace.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
